services:
  clipfetch:
    build:
      context: .
      dockerfile: Dockerfile
    image: clipfetch:latest
    container_name: clipfetch
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      # 60 minute cap on source duration
      MAX_DURATION_SECONDS: "3600"
      # 10 extraction requests per minute per IP
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_WINDOW_MS: "60000"
      TRUST_PROXY: loopback
      CORS_ORIGIN: "*"
    # Temporary downloads live in memory-backed /tmp, so nothing is left on disk.
    tmpfs:
      - /tmp:size=2g,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
