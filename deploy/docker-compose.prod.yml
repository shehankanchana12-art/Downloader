# Production stack: Clipfetch + Caddy (automatic HTTPS).
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env    # set DOMAIN
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443); the app itself is reachable only
# inside the compose network, so nothing can bypass HTTPS.

services:
  clipfetch:
    build:
      context: ..
      dockerfile: Dockerfile
    image: clipfetch:latest
    container_name: clipfetch
    restart: unless-stopped
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      MAX_DURATION_SECONDS: "3600"
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_WINDOW_MS: "60000"
      # Exactly one proxy in front of the app (Caddy), so the client IP comes
      # from the first X-Forwarded-For entry.
      TRUST_PROXY: "1"
      CORS_ORIGIN: "*"
    tmpfs:
      - /tmp:size=2g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: clipfetch-caddy
    restart: unless-stopped
    depends_on:
      - clipfetch
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
